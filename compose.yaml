services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in app/.env}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in app/.env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in app/.env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in app/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: runtime
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      TRUST_PROXY_HOPS: "0"
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in app/.env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in app/.env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in app/.env}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-3000}
      DATABASE_QUERY_TIMEOUT_MS: ${DATABASE_QUERY_TIMEOUT_MS:-5000}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set JWT_SECRET_BASE64 in app/.env}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in app/.env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in app/.env}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-900}
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live', { signal: AbortSignal.timeout(2000) }).then(response => process.exit(response.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres-test:
    image: postgres:17-alpine
    profiles: [integration]
    environment:
      POSTGRES_DB: task_api_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in app/.env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in app/.env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in app/.env}
    volumes:
      - ./docker/postgres/init/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  integration-test:
    profiles: [integration]
    build:
      context: ./app
      dockerfile: Dockerfile
      target: integration-test
    environment:
      NODE_ENV: test
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: silent
      CORS_ORIGINS: ""
      DATABASE_HOST: postgres-test
      DATABASE_PORT: 5432
      DATABASE_NAME: task_api_test
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in app/.env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in app/.env}
      DATABASE_POOL_MAX: 5
      DATABASE_IDLE_TIMEOUT_MS: 1000
      DATABASE_CONNECTION_TIMEOUT_MS: 3000
      DATABASE_QUERY_TIMEOUT_MS: 5000
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set JWT_SECRET_BASE64 in app/.env}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in app/.env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in app/.env}
      JWT_EXPIRES_IN_SECONDS: 900
      SHUTDOWN_TIMEOUT_MS: 5000
    depends_on:
      postgres-test:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres-data:
