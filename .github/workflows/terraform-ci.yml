name: Terraform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-validation:
    name: Format, mocked tests, validation and Checkov
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: "1.17.2"

      - name: Verify Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize and validate VPC module
        working-directory: terraform/modules/vpc
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Initialize and validate networking module
        working-directory: terraform/modules/networking
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Initialize and validate security module
        working-directory: terraform/modules/security
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Initialize and validate ALB module
        working-directory: terraform/modules/alb
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Initialize and validate ECR module
        working-directory: terraform/modules/ecr
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Initialize and validate ECS module
        working-directory: terraform/modules/ecs
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Initialize and validate IAM module
        working-directory: terraform/modules/iam
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Initialize and validate RDS module
        working-directory: terraform/modules/rds
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Initialize and validate secrets module
        working-directory: terraform/modules/secrets
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Initialize and validate monitoring module
        working-directory: terraform/modules/monitoring
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate development environment
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate production environment
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Install Checkov
        run: python3 -m pip install --user checkov

      - name: Run Checkov
        continue-on-error: true
        run: |
          set +e
          python3 -m checkov.main -d terraform --quiet --compact 2>&1 | tee checkov-results.txt
          exit 0

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkov-report
          path: checkov-results.txt
          if-no-files-found: warn
          retention-days: 30
